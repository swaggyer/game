[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/environment_v11/manifest.json,assets/locomotion_v12/manifest.json,assets/font-license/*.txt,assets/font-license/*.json,assets/audio_v13/licenses/*.txt"
exclude_filter="builds/*,docs/*,tests/*"
export_path="builds/StarLanternIsland.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Android"
